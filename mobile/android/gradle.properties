org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true

# New Architecture (enable for RN 0.73+)
newArchEnabled=false

# Hermes JS engine
hermesEnabled=true

# Release signing (set via local.properties or CI env)
PAGIR_STORE_FILE=pagir2-release.keystore
PAGIR_KEY_ALIAS=pagir2
PAGIR_STORE_PASSWORD=pagir2release
PAGIR_KEY_PASSWORD=pagir2release
